name: Build QuiAppelle v0.2 APK

on:
  push:
    branches:
      - agent/quiappelle-v2-brave
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Verify and extract source
        shell: bash
        run: |
          echo "22572f07f898ca23a2d283c9a1c16dd137007d9caaa07a6a6a982911ac13eb43  .build/QuiAppelle-v0.2-source.zip" | sha256sum --check
          mkdir -p build-src
          unzip -q .build/QuiAppelle-v0.2-source.zip -d build-src

      - name: Build debug APK
        working-directory: build-src/QuiAppelle
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify and rename APK
        shell: bash
        run: |
          APK="build-src/QuiAppelle/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p output
          cp "$APK" output/QuiAppelle-0.2.0-Brave.apk
          sha256sum output/QuiAppelle-0.2.0-Brave.apk > output/QuiAppelle-0.2.0-Brave.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuiAppelle-v0.2-APK
          path: output/*
          if-no-files-found: error
          retention-days: 7
